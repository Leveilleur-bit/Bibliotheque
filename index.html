<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Bibliothèque</title>
  <meta name="description" content="Mes livres audio Audible, ma bibliothèque papier et mes prochaines lectures.">
  <meta name="theme-color" content="#0b0c12">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <div class="entete-int">
      <h1 id="titre-vue">Ma Bibliothèque</h1>
      <div class="entete-actions">
        <button id="btn-synchro" class="btn-icone btn-synchro" hidden aria-label="Synchroniser avec GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 8.98H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-reglages" class="btn-icone" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="fond" class="fond" aria-hidden="true"></div>
  <main id="vue" class="vue" tabindex="-1"></main>

  <nav class="barre" aria-label="Sections">
    <button data-vue="audible" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="4" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="13" width="4" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Audible</span>
    </button>
    <button data-vue="fantasy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 0 0 6-9.5 9.5-6-6zM8.5 15.5l-4 4M5 13l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Fantasy</span>
    </button>
    <button data-vue="sf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c3 2.2 4.4 5.6 4.4 9.6l-1.6 4.4H9.2l-1.6-4.4c0-4 1.4-7.4 4.4-9.6zM9.4 16.8l-2.6 3.6 3.6-.8M14.6 16.8l2.6 3.6-3.6-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>SF</span>
    </button>
    <button data-vue="autre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.2 6-1 9 1 3-2 6-2.2 9-1v13c-3-1.2-6-1-9 1-3-2-6-2.2-9-1zM12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Autres</span>
    </button>
    <button data-vue="envies">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Envies</span>
    </button>
    <button data-vue="propositions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Idées</span>
    </button>
  </nav>

  <dialog id="fenetre" class="fenetre"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      // Nouvelle version installée : on recharge une fois pour l'afficher
      let dejaRecharge = false;
      const avaitControleur = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!avaitControleur || dejaRecharge) return;
        dejaRecharge = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
